[package]
name = "upcloud-cluster-autoscaler"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14.6"
prost-types = "0.14.6"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"

[build-dependencies]
tonic-prost-build = "0.14.9"
