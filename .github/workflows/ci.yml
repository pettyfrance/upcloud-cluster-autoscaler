name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build.rs needs protoc, plus the google/protobuf/*.proto files from
      # libprotobuf-dev. Same packages as the Dockerfile.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      # Same Rust version as the Dockerfile, so new lints in a newer stable
      # release can't break CI unexpectedly.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

  helm:
    runs-on: ubuntu-latest
    env:
      CHART: charts/upcloud-cluster-autoscaler
      CLUSTER_ID: 00000000-0000-4000-8000-000000000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0

      - name: Lint
        run: helm lint "$CHART" --set clusterId="$CLUSTER_ID" --set upcloud.existingSecret=uca-token

      - name: Render with valid values
        run: |
          helm template test "$CHART" --set clusterId="$CLUSTER_ID" --set upcloud.existingSecret=uca-token > /dev/null
          helm template test "$CHART" --set clusterId="$CLUSTER_ID" --set upcloud.token=example > /dev/null

      # Each of these must fail with the expected message, so a later change
      # can't quietly remove a safety check.
      - name: Reject invalid values
        run: |
          expect_fail() {
            local expected="$1"; shift
            if output=$(helm template test "$CHART" "$@" 2>&1); then
              echo "::error::expected failure ($expected) but rendering succeeded: $*"
              exit 1
            fi
            if ! grep -q "$expected" <<<"$output"; then
              echo "::error::expected '$expected' in the error, got:"
              echo "$output"
              exit 1
            fi
            echo "ok: $expected"
          }

          expect_fail "does not match pattern" --set upcloud.existingSecret=uca-token
          expect_fail "does not match pattern" --set clusterId=not-a-uuid --set upcloud.existingSecret=uca-token
          expect_fail "An UpCloud API token is required" --set clusterId="$CLUSTER_ID"
          expect_fail "Set only one of" --set clusterId="$CLUSTER_ID" --set upcloud.token=a --set upcloud.existingSecret=b
