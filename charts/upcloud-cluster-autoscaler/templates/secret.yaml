{{- if and .Values.upcloud.token (not .Values.upcloud.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uca.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uca.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.upcloud.token | b64enc | quote }}
{{- end }}
