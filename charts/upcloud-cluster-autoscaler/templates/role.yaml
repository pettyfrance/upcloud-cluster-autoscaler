# Adapted from the upstream cluster-autoscaler chart (tag cluster-autoscaler-1.36.2,
# charts/cluster-autoscaler/templates/role.yaml): the status ConfigMap only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "uca.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uca.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cluster-autoscaler-status"]
    verbs: ["delete", "get", "update"]
