apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uca.fullname" . }}-cloud-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uca.labels" . | nindent 4 }}
data:
  # The provider listens on localhost only, as a sidecar in the same pod, so
  # no TLS settings are needed.
  cloud-config: |-
    address: "localhost:8086"
